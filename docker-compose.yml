services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: massive-app:local
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started
    volumes:
      - ./app:/var/www/html/app
      - ./bootstrap:/var/www/html/bootstrap
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./artisan:/var/www/html/artisan
      - ./composer.json:/var/www/html/composer.json
      - ./composer.lock:/var/www/html/composer.lock
      - app-storage:/var/www/html/storage
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 512m
    memswap_limit: 768m
    networks:
      - massive

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: massive-web:local
    depends_on:
      - app
    ports:
      - "8080:80"
    restart: unless-stopped
    cpus: "0.25"
    mem_limit: 128m
    memswap_limit: 192m
    networks:
      - massive

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: massive-app:local
    env_file:
      - .env.docker
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - ./app:/var/www/html/app
      - ./bootstrap:/var/www/html/bootstrap
      - ./config:/var/www/html/config
      - ./database:/var/www/html/database
      - ./resources:/var/www/html/resources
      - ./routes:/var/www/html/routes
      - ./artisan:/var/www/html/artisan
      - ./composer.json:/var/www/html/composer.json
      - ./composer.lock:/var/www/html/composer.lock
      - app-storage:/var/www/html/storage
    restart: unless-stopped
    cpus: "0.35"
    mem_limit: 256m
    memswap_limit: 384m
    networks:
      - massive

  db:
    image: mysql:8.4
    env_file:
      - .env.docker
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - massive

  ml-service:
    build:
      context: ./ml_service
    image: massive-ml-service:local
    env_file:
      - .env.docker
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 900m
    memswap_limit: 1280m
    networks:
      - massive

volumes:
  app-storage:
  db-data:

networks:
  massive:
    driver: bridge
